<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ding ang BATO!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrapper">
    <div id="hud">
      <span id="score-label">SCORE <span id="score">0</span></span>
      <span id="hi-label">BEST <span id="hi-score">0</span></span>
    </div>

    <div id="hud-pause">
      <button id="btn-pause" title="Pause (P)">&#9646;&#9646;</button>
    </div>

    <div id="canvas-container">
      <canvas id="game" width="800" height="300"></canvas>

      <!-- PAUSE -->
      <div id="pause-overlay">
        <p id="pause-title">PAUSED</p>
        <button class="menu-btn" id="btn-resume">&#9654; RESUME</button>
        <p id="pause-hint">P or ESC to toggle</p>
      </div>

      <!-- HOME SCREEN -->
      <div id="home-overlay" class="visible">
        <p id="home-title">Ding ang BATO!</p>
        <div id="home-buttons">
          <button class="menu-btn" id="btn-start">&#9654; START</button>
          <button class="menu-btn" id="btn-choose">&#128100; CHOOSE CHARACTER</button>
          <button class="menu-btn secondary" id="btn-scoreboard">&#127942; SCOREBOARD</button>
        </div>
      </div>

      <!-- NAME INPUT -->
      <div id="name-overlay">
        <p class="screen-title">Enter Your Name</p>
        <input id="name-input" type="text" maxlength="12"
               placeholder="PLAYER" autocomplete="off" spellcheck="false" />
        <button class="menu-btn" id="btn-play">&#9654; PLAY</button>
        <button class="menu-btn secondary" id="btn-name-back">&#8592; BACK</button>
      </div>

      <!-- SCOREBOARD -->
      <div id="scoreboard-overlay">
        <p class="screen-title">&#127942; SCOREBOARD</p>
        <ol id="score-list"></ol>
        <button class="menu-btn secondary" id="btn-score-back">&#8592; BACK</button>
      </div>

      <!-- CHARACTER SELECT -->
      <div id="character-overlay">
        <p class="screen-title">Choose Your Character</p>
        <div id="char-grid">
          <div class="char-card" data-id="0">
            <canvas class="char-preview" width="80" height="100"></canvas>
            <p class="char-name">Tao</p>
          </div>
          <div class="char-card" data-id="1">
            <canvas class="char-preview" width="80" height="100"></canvas>
            <p class="char-name">Mandirigma</p>
          </div>
          <div class="char-card" data-id="2">
            <canvas class="char-preview" width="80" height="100"></canvas>
            <p class="char-name">Engkanto</p>
          </div>
          <div class="char-card" data-id="3">
            <canvas class="char-preview" width="80" height="100"></canvas>
            <p class="char-name">Roboto</p>
          </div>
          <div class="char-card" data-id="4">
            <canvas class="char-preview" width="80" height="100"></canvas>
            <p class="char-name">Aswang</p>
          </div>
        </div>
        <button class="menu-btn secondary" id="btn-back">&#8592; BACK</button>
      </div>

      <!-- GAME OVER -->
      <div id="gameover-overlay">
        <p id="gameover-title">GAME OVER</p>
        <p id="gameover-score"></p>
        <div id="gameover-buttons">
          <button class="menu-btn" id="btn-retry">&#9654; RETRY</button>
          <button class="menu-btn secondary" id="btn-home">&#8962; HOME</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
